<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CpfValidator Pro — Playground & Demonstração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --text: #f9fafb;
      --text-muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container { max-width: 800px; width: 100%; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    p.lead { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .input-group { display: flex; gap: 12px; margin-bottom: 16px; }
    input {
      flex: 1;
      background: #040711;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: all 0.2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    button {
      background: var(--accent);
      color: #040711;
      font-weight: 700;
      font-size: 14px;
      padding: 0 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .actions { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
    }
    .output-box {
      background: #040711;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #38bdf8;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 140px;
      line-height: 1.5;
    }
    footer { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: auto; padding-top: 40px; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">⚡ Validação Local em RAM (0ms) ou Cloudflare Edge (<5ms)</div>
    <h1>CpfValidator Pro Playground</h1>
    <p class="lead">Validação oficial por Módulo 11 com detecção instantânea da Região Fiscal da Receita Federal.</p>

    <div class="card">
      <div class="input-group">
        <input type="text" id="cpfInput" placeholder="Digite o CPF (ex: 529.982.247-25)" value="529.982.247-25">
        <button onclick="validar()">Validar Agora</button>
      </div>
      <div class="actions">
        <button class="btn-secondary" onclick="gerarAleatorio()">🎲 Gerar CPF Válido</button>
        <button class="btn-secondary" onclick="testarInvalido()">❌ Testar Dígitos Repetidos</button>
      </div>
      <div class="output-box" id="resultOutput">Pronto para validar.</div>
    </div>

    <footer>
      Parte oficial do ecossistema <a href="https://ponte.ozpro.com.br" target="_blank">Ponte API Marketplace</a> &bull; Código aberto no <a href="https://github.com/clepta2/cpfvalidator-pro" target="_blank">GitHub</a>
    </footer>
  </div>

  <script type="module">
    import { CpfValidatorPro } from '../cpfvalidator-pro.js';

    window.validar = function() {
      const val = document.getElementById('cpfInput').value;
      const res = CpfValidatorPro.validarLocal(val);
      document.getElementById('resultOutput').innerText = JSON.stringify(res, null, 2);
    };

    window.gerarAleatorio = function() {
      const novo = CpfValidatorPro.gerarTeste();
      document.getElementById('cpfInput').value = novo;
      window.validar();
    };

    window.testarInvalido = function() {
      document.getElementById('cpfInput').value = '222.222.222-22';
      window.validar();
    };

    window.validar();
  </script>
</body>
</html>
